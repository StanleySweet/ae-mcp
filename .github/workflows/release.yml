name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run check
      - run: npm run bundle:pack
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: dist/*.mcpb
  installer:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run installer:build
        env:
          AE_MCP_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.arch }}
          path: apps/installer/dist/*.dmg
  publish:
    needs: [mcpb, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: cd artifacts && find . -type f \( -name '*.mcpb' -o -name '*.dmg' \) -exec sha256sum {} + > ../SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.mcpb
            artifacts/**/*.dmg
            SHA256SUMS.txt

name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bundle:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/*.mcpb
  installer:
    needs: mcpb
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: apps/installer/resources
      - run: npm run installer:build -- --mac dmg zip --arm64 --x64
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: apps/installer/dist/*.dmg
  publish:
    needs: [mcpb, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: cd artifacts && find . -type f \( -name '*.mcpb' -o -name '*.dmg' \) -exec sha256sum {} + > ../SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.mcpb
            artifacts/**/*.dmg
            SHA256SUMS.txt

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AE-MCP Setup</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
      }
      .setup {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
      }
      button {
        padding: 0.5rem 0.9rem;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        background: color-mix(in srgb, currentColor 5%, transparent);
        font: inherit;
      }
      button:disabled {
        opacity: 0.5;
      }
      .progress {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      .quit-prompt {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, currentColor 6%, transparent);
      }
      .quit-prompt[hidden] {
        display: none;
      }
      .checklist {
        list-style: none;
        margin: 1.5rem 0;
        padding: 0;
        display: grid;
        gap: 0.5rem;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.25rem 0.75rem;
        padding: 0.75rem 1rem;
        border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        border-radius: 8px;
      }
      .row__status {
        font-weight: 600;
      }
      .row__fix {
        grid-column: 1 / -1;
        margin: 0;
        opacity: 0.7;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="setup">
      <h1>AE-MCP Setup</h1>
      <div class="controls">
        <button id="install" type="button">Install</button>
        <button id="uninstall" type="button">Uninstall</button>
        <span id="progress" class="progress" aria-live="polite"></span>
      </div>
      <div id="quit-prompt" class="quit-prompt" role="alert" hidden>
        <span>After Effects is open. Quit it (&#8984;Q), then retry.</span>
        <button id="retry" type="button">Retry</button>
      </div>
      <ul id="checklist" class="checklist"></ul>
    </main>
    <script type="module" src="./dist/renderer.js"></script>
  </body>
</html>
